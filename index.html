<style>
/* 布局：顶部控制条 → 中间按比例缩放的乐高底板舞台（左输入 → 中主干 → 右输出）→ 底部零件库；右侧可开关讲解提示栏 */
:root{
  --bench:#191d24; --bench-2:#232933; --bench-3:#2d3440; --line:#3a4250;
  --ink:#f3f5f7; --ink-dim:#a8b0bc; --ink-dark:#1b1d21;
  --plate:#9ba2ab; --plate-lo:#878e98; --socket:#7c838d;
  --c-input:#1d6fd8; --c-connector:#f2c12e; --c-backbone:#59626f;
  --c-pos:#7a4fd8; --c-norm:#0f9f96; --c-attn:#d33a2f; --c-ffn:#cf4380;
  --c-text:#2b9a46; --c-action:#ec7614; --c-recipe:#cdd2d9;
  --warn:#ff5b4f; --okc:#86e09a; --gold:#ffd166;
  --f-ui:"Nunito","PingFang SC","Microsoft YaHei","Noto Sans SC","Hiragino Sans GB",system-ui,sans-serif;
  --f-mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bench);color:var(--ink);font-family:var(--f-ui);font-size:15px;overflow:hidden;
  display:flex;flex-direction:column;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* ---------- 顶部 ---------- */
header{display:flex;flex-direction:column;gap:8px;padding:10px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));
  background:var(--bench-2);border-bottom:1px solid var(--line)}
.row1{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
h1{margin:0;font-size:21px;font-weight:900;letter-spacing:.02em;white-space:nowrap;display:flex;align-items:center;gap:10px}
h1 .logo{display:inline-flex;gap:3px;padding:6px 7px 4px;background:var(--c-attn);border-radius:5px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
h1 .logo i{width:9px;height:9px;border-radius:50%;background:#ef6a60;box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
h1 small{font-weight:700;color:var(--ink-dim);font-size:15px}
#badge{flex:1;min-width:220px;display:flex;justify-content:center}
.badge{display:inline-flex;align-items:center;gap:10px;padding:7px 16px;border-radius:999px;font-weight:800;font-size:17px;
  background:var(--bench-3);color:var(--ink-dim);border:1px solid var(--line);max-width:100%}
.badge.full{background:var(--gold);color:var(--ink-dark);border-color:transparent;animation:pop .5s}
.badge.near{background:#3b3320;color:var(--gold);border-color:#6b5a2a}
.badge.near{flex-direction:column;align-items:flex-start;gap:2px;border-radius:14px;padding:6px 16px;max-width:min(760px,100%)}
.badge .nm{white-space:nowrap}
.badge .pct{font-family:var(--f-mono);font-size:14px;background:rgba(255,209,102,.18);border-radius:5px;padding:0 6px;margin-left:4px}
.badge .diff{font-weight:700;font-size:14px;color:#efe2b8;line-height:1.4;white-space:normal;overflow-wrap:anywhere}
#badge{gap:8px;align-items:center}
.simbtn{flex:none;background:var(--bench-3);border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer;font-weight:800;font-size:13px;color:var(--ink-dim);white-space:nowrap}
.simbtn:hover,.simbtn.on{color:var(--ink);background:#384050}
#sim{position:fixed;z-index:450;background:var(--bench-2);border:1px solid var(--line);border-radius:14px;box-shadow:0 16px 40px rgba(0,0,0,.6);
  padding:10px;display:flex;flex-direction:column;gap:4px;max-height:calc(100vh - 140px);overflow:auto}
.sim-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;padding:2px 6px 6px}
.sim-h b{font-size:16px}.sim-h span{font-size:12px;color:var(--ink-dim)}
.sim-row{display:grid;grid-template-columns:22px 150px 1fr 64px;grid-template-areas:"rk sn bar sp" ". sd sd sd";gap:2px 10px;align-items:center;
  text-align:left;background:transparent;border:none;border-radius:10px;padding:7px 8px;cursor:pointer}
.sim-row:hover{background:var(--bench-3)}
.sim-row.hit{background:rgba(255,209,102,.12)}
.sim-row .rk{grid-area:rk;font-family:var(--f-mono);color:var(--ink-dim);font-size:13px}
.sim-row .sn{grid-area:sn;font-weight:900;font-size:15px;display:flex;align-items:center;gap:6px;min-width:0}
.sim-row .sn em{font-style:normal;font-size:10px;font-weight:800;padding:1px 5px;border-radius:4px;background:#4b5563}
.sim-row .sn em[data-kind=VLM]{background:#2a64b8}.sim-row .sn em[data-kind=VLA]{background:#c4640f}
.sim-row .bar{grid-area:bar;height:10px;border-radius:5px;background:var(--bench-3);overflow:hidden}
.sim-row .bar i{display:block;height:100%;background:var(--gold);border-radius:5px}
.sim-row .sp{grid-area:sp;font-family:var(--f-mono);font-weight:800;font-size:14px;text-align:right;font-variant-numeric:tabular-nums}
.sim-row .sp small{display:block;font-size:10px;color:var(--ink-dim);font-weight:600}
.sim-row .sd{grid-area:sd;font-size:13px;color:var(--ink-dim);line-height:1.45;min-width:0}
.ctrls{display:flex;gap:6px;flex-wrap:wrap}
.btn{background:var(--bench-3);border:1px solid var(--line);border-radius:8px;padding:6px 11px;cursor:pointer;font-weight:700;font-size:14px;
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:#384050}
.btn kbd{font-family:var(--f-mono);font-size:11px;color:var(--ink-dim);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.btn.primary{background:var(--c-text);border-color:transparent}
.btn.primary:hover{background:#33ad52}
.btn.on{background:var(--gold);color:var(--ink-dark);border-color:transparent}
.btn.on kbd{color:var(--ink-dark);border-color:rgba(0,0,0,.3)}
.presets{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.presets .lbl{color:var(--ink-dim);font-size:13px;font-weight:700;margin-right:2px}
.pbtn{border:none;border-radius:6px;padding:5px 10px 4px;cursor:pointer;font-weight:800;font-size:14px;color:#fff;position:relative;
  background:var(--pc,#555);box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.pbtn .k{font-family:var(--f-mono);font-size:11px;opacity:.75;margin-right:5px}
.pbtn.active{outline:3px solid var(--gold);outline-offset:1px}
.pbtn[data-kind=LLM]{--pc:#4b5563}.pbtn[data-kind=VLM]{--pc:#2a64b8}.pbtn[data-kind=VLA]{--pc:#c4640f}

/* ---------- 主体 ---------- */
main{flex:1;min-height:0;display:flex}
#stageWrap{flex:1;min-width:0;position:relative;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1440px;height:660px;transform-origin:0 0;border-radius:18px;
  background-color:var(--plate);
  background-image:radial-gradient(circle at 50% 42%,rgba(255,255,255,.30) 0 4.5px,transparent 5.5px),
                   radial-gradient(circle at 50% 56%,rgba(0,0,0,.16) 0 5.5px,transparent 6.5px);
  background-size:24px 24px;box-shadow:0 10px 30px rgba(0,0,0,.45),inset 0 -6px 0 var(--plate-lo)}
.zone{position:absolute;top:18px;font-weight:900;font-size:15px;letter-spacing:.12em;color:#3b414a;text-transform:uppercase;transition:opacity .3s}
.zone span{letter-spacing:0;font-size:16px;margin-right:6px;color:#2e333a}
#stage.flowing .zone{opacity:0}

/* 插槽 */
.slot{position:absolute;border-radius:12px;background:var(--socket);
  box-shadow:inset 0 3px 8px rgba(0,0,0,.35),inset 0 -1px 0 rgba(255,255,255,.15);transition:box-shadow .2s, transform .2s}
.slot-label{position:absolute;left:8px;right:8px;top:6px;height:22px;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:800;color:#f2f4f6;
  pointer-events:auto}
.slot-label .dot{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}
.slot-label>span:not(.dot),.slot-label{white-space:nowrap}
.slot-label em{min-width:0;font-style:normal;color:#d6dae0;font-weight:600;font-size:12px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot-label .swap{margin-left:auto;background:rgba(0,0,0,.28);border:none;border-radius:5px;padding:1px 7px;cursor:pointer;font-size:12px;font-weight:800;color:#fff;flex:none}
.slot-label .swap:hover{background:rgba(0,0,0,.5)}
.socket{position:absolute;left:8px;right:8px;top:36px;bottom:8px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.socket.empty{border:2px dashed rgba(255,255,255,.35);cursor:pointer;color:rgba(255,255,255,.75);font-size:13px;font-weight:700;text-align:center;padding:4px}
.socket.empty:hover{border-color:#fff;color:#fff}
.slot.can-drop{box-shadow:inset 0 3px 8px rgba(0,0,0,.35),0 0 0 3px rgba(134,224,154,.75)}
.slot.hover-ok{box-shadow:inset 0 3px 8px rgba(0,0,0,.35),0 0 0 4px var(--okc),0 0 18px var(--okc);transform:scale(1.02)}
.slot.hover-bad,.slot.bad{box-shadow:inset 0 3px 8px rgba(0,0,0,.35),0 0 0 4px var(--warn),0 0 18px var(--warn)}
.slot.bad{animation:shake .42s}
.slot.changed{animation:glow 1s ease-in-out 3}
.slot.flow-focus{box-shadow:inset 0 3px 8px rgba(0,0,0,.35),0 0 0 4px var(--gold),0 0 26px rgba(255,209,102,.8)}

/* 积木 */
.brick{--c:var(--c-backbone);position:relative;background:var(--c);border-radius:7px;color:#fff;cursor:grab;
  box-shadow:inset 0 -5px 0 rgba(0,0,0,.24),inset 0 2px 0 rgba(255,255,255,.28),0 4px 8px rgba(0,0,0,.35);
  display:flex;align-items:center;padding:10px 12px 12px;touch-action:none}
.brick:active{cursor:grabbing}
.brick .studs{position:absolute;top:-8px;left:12px;right:12px;display:flex;justify-content:space-around;pointer-events:none}
.brick .studs i{width:20px;height:9px;border-radius:4px 4px 1px 1px;background:linear-gradient(color-mix(in srgb,var(--c),#fff 38%),var(--c));
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.2)}
.brick .face{display:flex;flex-direction:column;min-width:0;line-height:1.15}
.brick .face b{font-size:17px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brick .face small{font-size:12px;font-weight:700;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.socket>.brick{width:100%;height:100%}
.brick[data-cat=input]{--c:var(--c-input)}.brick[data-cat=connector]{--c:var(--c-connector);color:var(--ink-dark)}
.brick[data-cat=backbone]{--c:var(--c-backbone)}.brick[data-cat=pos]{--c:var(--c-pos)}.brick[data-cat=norm]{--c:var(--c-norm)}
.brick[data-cat=attn]{--c:var(--c-attn)}.brick[data-cat=ffn]{--c:var(--c-ffn)}.brick[data-cat=text]{--c:var(--c-text)}
.brick[data-cat=action]{--c:var(--c-action)}.brick[data-cat=recipe]{--c:var(--c-recipe);color:var(--ink-dark)}
.brick.mini{padding:8px 10px 10px;min-width:118px;max-width:190px}
.brick.mini .face b{font-size:14px}.brick.mini .face small{font-size:11px}
.brick.mini .studs i{width:14px;height:7px}.brick.mini .studs{top:-6px}
.brick.inuse::after{content:"";position:absolute;right:5px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 2px rgba(0,0,0,.3)}
.brick.snap{animation:snap .42s cubic-bezier(.3,1.6,.5,1)}
.ghost{position:fixed;z-index:1000;pointer-events:none;opacity:.92;transform:rotate(-3deg);box-shadow:0 14px 28px rgba(0,0,0,.5)}

/* 源数据卡 */
.src{position:absolute;border-radius:10px;background:#eef1f4;color:var(--ink-dark);padding:8px 10px;box-shadow:0 3px 0 rgba(0,0,0,.2);transition:opacity .3s}

/* 主干 */
.bb-layer{position:absolute;border-radius:12px;background:#666d77;box-shadow:inset 0 -5px 0 rgba(0,0,0,.25),0 3px 6px rgba(0,0,0,.25)}

.bb-model.empty{border:2px dashed rgba(255,255,255,.4);border-radius:8px;align-items:center;justify-content:center;color:rgba(255,255,255,.8);font-weight:700;font-size:13px;cursor:pointer;text-align:center}
.bb-chips{position:absolute;left:12px;right:12px;top:116px;display:flex;flex-direction:column;gap:8px}
.chip-slot{height:48px;border-radius:8px;position:relative;display:flex;transition:box-shadow .2s}
.chip-slot>.brick{width:100%;padding:6px 10px 8px}
.chip-slot>.brick .face{flex-direction:row;align-items:baseline;gap:8px}
.chip-slot>.brick .face b{font-size:15px}
.chip-slot>.brick .face small{display:none}
.chip-slot .tag{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:11px;font-weight:800;opacity:.8;pointer-events:none}
.chip-slot.empty{border:2px dashed rgba(255,255,255,.4);align-items:center;padding-left:12px;font-size:13px;font-weight:700;color:rgba(255,255,255,.8);cursor:pointer}
.chip-slot.can-drop{box-shadow:0 0 0 3px rgba(134,224,154,.75)}
.chip-slot.hover-ok{box-shadow:0 0 0 4px var(--okc),0 0 14px var(--okc)}
.chip-slot.hover-bad,.chip-slot.bad{box-shadow:0 0 0 4px var(--warn)}
.chip-slot.bad{animation:shake .42s}
.chip-slot.flow-focus{box-shadow:0 0 0 4px var(--gold),0 0 20px rgba(255,209,102,.9)}
.chip-slot.changed{animation:glow 1s ease-in-out 3}
.bb-foot{position:absolute;left:12px;right:12px;top:334px;height:30px;display:flex;align-items:center;gap:8px}
.layers{font-weight:900;font-size:15px;background:#2d333c;color:var(--gold);padding:3px 9px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%}
.expand{margin-left:auto;background:var(--gold);color:var(--ink-dark);border:none;border-radius:6px;padding:4px 10px;font-weight:900;cursor:pointer;font-size:13px;white-space:nowrap}
.bb-tokzone{position:absolute;left:12px;right:12px;top:372px;bottom:10px;border-radius:8px;background:rgba(0,0,0,.14)}

/* 输出端 */
.outzone{position:absolute;border-radius:12px;background:rgba(40,46,55,.82);padding:10px;color:var(--ink)}
.outzone h4{margin:0;font-size:13px;font-weight:900;letter-spacing:.04em;color:#d9dde3;display:flex;align-items:center;gap:6px}
.outzone h4 .dot{width:10px;height:10px;border-radius:3px}

.out-act-h{position:absolute;left:10px;top:200px}
.out-act{top:224px;bottom:10px}

.arm{position:absolute;left:0;right:0;bottom:6px;margin:auto;width:150px}
.arm .j1,.arm .j2,.arm .grip{transform-box:view-box}
.arm .j1{transform-origin:75px 160px}.arm .j2{transform-origin:75px 98px}.arm .grip{transform-origin:118px 72px}
.arm.moving .j1{animation:j1 2.2s ease-in-out infinite alternate}
.arm.moving .j2{animation:j2 2.2s ease-in-out infinite alternate}

/* 线路 */
#wires{position:absolute;inset:0;pointer-events:none}

/* token 动画层 */
#tokLayer{position:absolute;inset:0;pointer-events:none;z-index:20}
.tok{position:absolute;left:0;top:0;height:28px;min-width:28px;padding:0 7px;border-radius:5px;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:900;color:#fff;white-space:nowrap;
  transition:transform .8s cubic-bezier(.45,0,.2,1),opacity .5s,background .5s,width .5s,height .5s;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.25),0 2px 4px rgba(0,0,0,.3)}

.t-text{background:var(--c-input)}

.t-act{background:var(--c-action);font-size:12px}

.cap{position:absolute;left:196px;right:200px;top:8px;min-height:52px;border-radius:12px;background:var(--bench);color:var(--ink);
  padding:8px 16px;display:flex;align-items:center;gap:14px;z-index:30;box-shadow:0 6px 18px rgba(0,0,0,.45);font-size:18px;font-weight:700;line-height:1.35}
.cap .n{font-family:var(--f-mono);font-size:14px;color:var(--gold);white-space:nowrap}
.cap .t{font-weight:900;color:var(--gold);white-space:nowrap}

.cap.warn .t{color:#ff9d94}

/* 第二层：Block 内部 */
#blockView{position:absolute;inset:0;border-radius:18px;z-index:40;background:#3a414b;
  background-image:radial-gradient(circle at 50% 42%,rgba(255,255,255,.07) 0 4.5px,transparent 5.5px);background-size:24px 24px;
  opacity:0;transform:scale(.2);pointer-events:none;transition:transform .55s cubic-bezier(.3,1.15,.4,1),opacity .35s}

.bv-top{position:absolute;left:24px;right:24px;top:18px;display:flex;align-items:center;gap:16px}

.bv-el.slot{background:#666e79}
.bv-add{width:50px;height:50px;border-radius:50%;background:#eef1f4;color:var(--ink-dark);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;box-shadow:0 3px 0 rgba(0,0,0,.3)}
.bv-add small{position:absolute;top:56px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--ink-dim);white-space:nowrap;font-weight:700}
.bv-pill{background:#eef1f4;color:var(--ink-dark);border-radius:10px;padding:8px 10px;font-weight:900;font-size:14px;text-align:center;line-height:1.25}
.slot.mirror{opacity:.75}
.slot.mirror .slot-label em::after{content:" · 同一块"}
#bvSvg{position:absolute;inset:0;pointer-events:none}
#bvSvg .main{stroke:#eef1f4;stroke-width:5;fill:none}
#bvSvg .res{stroke:var(--gold);stroke-width:5;fill:none;stroke-dasharray:12 8;transition:d .6s}
#bvSvg text{fill:var(--gold);font-size:15px;font-weight:900;font-family:var(--f-ui)}
.bv-notes{position:absolute;left:24px;right:18px;top:500px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.note{background:rgba(0,0,0,.28);border-radius:12px;padding:10px 12px;min-height:146px;display:flex;flex-direction:column;gap:4px}
.note h5{margin:0;font-size:14px;font-weight:900;display:flex;align-items:center;gap:6px}
.note h5 .dot{width:10px;height:10px;border-radius:3px}
.note p{margin:0;font-size:14px;color:#dfe3e8;line-height:1.4;font-weight:600}
.note svg{margin-top:auto;width:100%;height:64px}
.note svg text{font-family:var(--f-ui);font-weight:800}

/* 零件库 */
#lib{height:236px;flex:none;background:var(--bench-2);border-top:1px solid var(--line);display:flex;flex-direction:column;
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lib-tabs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.lib-tabs h3{margin:0 10px 0 0;font-size:15px;font-weight:900}
.tab{background:transparent;border:1px solid var(--line);border-radius:999px;padding:3px 12px;cursor:pointer;font-weight:700;font-size:13px;color:var(--ink-dim)}
.tab.on{background:var(--ink);color:var(--ink-dark);border-color:transparent}
.lib-tabs .hint{margin-left:auto;color:var(--ink-dim);font-size:12px}
.lib-body{flex:1;min-height:0;overflow:auto;display:flex;flex-wrap:wrap;gap:14px 22px;align-content:flex-start;padding-top:6px}
.grp{display:flex;flex-direction:column;gap:6px;min-width:0}
.grp h4{margin:0;font-size:12px;font-weight:800;color:var(--ink-dim);display:flex;align-items:center;gap:6px;white-space:nowrap}
.grp h4 .dot{width:9px;height:9px;border-radius:3px}
.grp .items{display:flex;flex-wrap:wrap;gap:12px 8px;padding-top:6px}

/* 讲解提示 */
#hints{width:340px;flex:none;background:var(--bench-2);border-left:1px solid var(--line);overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
#hints h3{margin:0;font-size:14px;font-weight:900;color:var(--ink-dim);letter-spacing:.06em}
#hints .now{font-size:18px;font-weight:800;line-height:1.45}
#hints ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:15px;line-height:1.45;color:#e2e6eb}
#hints .keys{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:13px;color:var(--ink-dim)}
#hints .keys kbd{font-family:var(--f-mono);color:var(--ink);background:var(--bench-3);border-radius:4px;padding:1px 6px;text-align:center}

/* 演化横幅 */
#evo{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:60;width:min(92%,980px);background:var(--bench);border:2px solid var(--gold);
  border-radius:14px;padding:10px 16px;box-shadow:0 10px 30px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:4px}
#evo .route{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-weight:800;font-size:14px;color:var(--ink-dim)}
#evo .route b{padding:2px 8px;border-radius:6px;background:var(--bench-3)}
#evo .route b.cur{background:var(--gold);color:var(--ink-dark)}
#evo .route b.done{color:var(--ink)}
#evo .msg{font-size:18px;font-weight:800;line-height:1.4}
#evo .chg{font-size:14px;color:#e8d9a8;font-weight:700;line-height:1.5}

/* 弹窗 */
#pop{position:fixed;z-index:500;background:var(--bench-2);border:1px solid var(--line);border-radius:12px;padding:10px;box-shadow:0 14px 34px rgba(0,0,0,.55);
  display:flex;flex-direction:column;gap:12px;max-height:70vh;overflow:auto;padding-top:16px}
#pop h4{margin:-4px 0 0;font-size:13px;color:var(--ink-dim)}
#pop .opt{display:flex;align-items:center;gap:10px}
#pop .opt .brick{cursor:pointer}
#pop .opt.cur .brick{outline:3px solid var(--gold)}
#pop .rm{background:transparent;border:1px dashed var(--line);border-radius:8px;padding:6px;color:var(--ink-dim);cursor:pointer;font-weight:700}
#cardBg{position:fixed;inset:0;z-index:800;background:rgba(10,12,16,.6);display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:min(760px,100%);max-height:92vh;overflow:auto;background:#f4f6f8;color:var(--ink-dark);border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.6);animation:pop .3s}
.card-top{display:flex;gap:16px;align-items:center;padding:20px 22px 16px;background:var(--c);color:#fff;border-radius:16px 16px 0 0;position:relative;
  box-shadow:inset 0 -6px 0 rgba(0,0,0,.2)}
.card-top.darktxt{color:var(--ink-dark)}
.card-top .studs{display:flex;gap:8px;position:absolute;top:-9px;left:30px}
.card-top .studs i{width:30px;height:11px;border-radius:5px 5px 1px 1px;background:linear-gradient(color-mix(in srgb,var(--c),#fff 38%),var(--c))}
.card-top h2{margin:0;font-size:28px;font-weight:900;line-height:1.15}
.card-top .meta{font-size:15px;font-weight:700;opacity:.9;margin-top:4px}
.card-top .x{margin-left:auto;align-self:flex-start;background:rgba(0,0,0,.25);border:none;border-radius:8px;padding:4px 10px;cursor:pointer;font-weight:900;color:inherit}
.card dl{margin:0;padding:16px 22px 22px;display:grid;grid-template-columns:7.5em 1fr;gap:12px 14px;font-size:17px;line-height:1.5}

.card dd.big{font-size:19px;font-weight:800}
.card a{color:#1559b3;font-weight:800}
.tbv{display:inline-block;margin-left:6px;font-size:12px;font-weight:900;color:#9a3412;background:#ffedd5;border-radius:5px;padding:0 6px;vertical-align:2px}
.card .links{display:flex;flex-direction:column;gap:2px}

@keyframes snap{0%{transform:translateY(-26px) scale(1.06);opacity:.5}60%{transform:translateY(3px) scale(.98);opacity:1}100%{transform:none}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(5px)}}
@keyframes glow{0%,100%{filter:none}50%{filter:drop-shadow(0 0 14px var(--gold)) brightness(1.15)}}
@keyframes pop{0%{transform:scale(.85);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes tpulse{50%{filter:brightness(1.6) drop-shadow(0 0 8px var(--gold))}}
@keyframes j1{from{transform:rotate(-14deg)}to{transform:rotate(16deg)}}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media (max-width:760px){#hints{display:none}h1 small{display:none}#lib{height:180px}}

<body>
<header>
  <div class="row1">
    <h1><span class="logo"><i></i><i></i><i></i></span>乐高拼模型 <small>LLM / VLM / VLA</small></h1>
    <div id="badge"></div>
    <div class="ctrls">
      <button class="btn primary" id="bRun" title="运行数据流">运行 <kbd>R</kbd></button>
      <button class="btn" id="bStep" title="逐步推进">下一步 <kbd>空格</kbd></button>
      <button class="btn" id="bEvo">演化路线 <kbd>E</kbd></button>
      <button class="btn" id="bUndo">撤销 <kbd>Ctrl Z</kbd></button>
      <button class="btn" id="bClear">清空</button>
      <button class="btn on" id="bHints">讲解提示 <kbd>H</kbd></button>
      <button class="btn on" id="bSound">咔哒声</button>
      <button class="btn" id="bFull">全屏 <kbd>F</kbd></button>
    </div>
  </div>
  <div class="presets" id="presets"><span class="lbl">一键拼装</span></div>
</header>
<main>
  <div id="stageWrap">
    <div id="stage">
      <svg id="wires" viewBox="0 0 1440 660"></svg>
      <div class="zone" style="left:28px"><span>输入端</span>INPUT</div>
      <div class="zone" style="left:720px"><span>主干</span>BACKBONE</div>
      <div class="zone" style="left:1050px"><span>输出端</span>OUTPUT</div>
      <div id="slots1"></div>
      <div id="tokLayer"></div>
      <div id="blockView"></div>
    </div>
    <div id="evo" hidden></div>
  </div>
  <aside id="hints"></aside>
</main>
<section id="lib"></section>
<div id="pop" hidden></div>
<div id="sim" hidden></div>
<div id="cardBg" hidden></div>

<script>
"use strict";
/* ================= 数据 ================= */
const CFG = JSON.parse(document.getElementById('lego-config').textContent);
const B = {}; CFG.bricks.forEach(b => B[b.id] = b);
const SLOT = {}; CFG.slots.forEach(s => SLOT[s.id] = s);
const PRESET = {}; CFG.presets.forEach(p => PRESET[p.id] = p);
const L1 = ['tokenizer','vision','connector','proprio','backbone','head'];
const INNER = ['pos','norm','attn','ffn'];
const KEYS = [...L1, ...INNER];
const $ = (q, r = document) => r.querySelector(q);
const $$ = (q, r = document) => [...r.querySelectorAll(q)];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* 舞台坐标（1440×660 逻辑像素，整体按比例缩放） */
const LAY = {
  srcText:  {x:24, y:64,  w:156, h:120},
  tokenizer:{x:196,y:64,  w:224, h:120},
  srcImage: {x:24, y:250, w:156, h:120},
  vision:   {x:196,y:250, w:224, h:120},
  connector:{x:446,y:250, w:212, h:120},
  srcState: {x:24, y:436, w:156, h:120},
  proprio:  {x:196,y:436, w:224, h:120},
  backbone: {x:690,y:64,  w:300, h:496},
  head:     {x:1020,y:250,w:224, h:120},
  out:      {x:1262,y:64, w:162, h:496},
  recipe:   {x:196,y:582, w:1048,h:66}
};
const BB_TOK = {x:LAY.backbone.x+12, y:LAY.backbone.y+372, w:LAY.backbone.w-24, h:LAY.backbone.h-382};

/* ================= 状态 ================= */
const emptyState = () => ({slots:{tokenizer:null,vision:null,connector:null,proprio:null,backbone:null,head:null},
                           inner:{pos:null,norm:null,attn:null,ffn:null}, recipe:[]});
let st = emptyState();
const hist = [];
const clone = o => JSON.parse(JSON.stringify(o));
const val = (s, k) => L1.includes(k) ? s.slots[k] : s.inner[k];
let blockOpen = false, flow = null, evo = null, card = null, popKey = null, soundOn = true, hintsOn = true, libTab = 'all';

function commit(fn, opts = {}) {
  if (flow) cancelFlow();
  const prev = clone(st);
  fn(st);
  if (JSON.stringify(prev) === JSON.stringify(st)) return false;
  hist.push(prev); if (hist.length > 100) hist.shift();
  render(prev, opts);
  return true;
}
function placeInto(s, id, target) {
  const b = B[id];
  if (target === 'recipe') { if (!s.recipe.includes(id)) s.recipe.push(id); return; }
  if (INNER.includes(b.slot)) { s.inner[b.slot] = id; return; }
  s.slots[b.slot] = id;
  if (b.slot === 'backbone' && b.inner) s.inner = {...b.inner};
}
function removeFrom(s, key, id) {
  if (key === 'recipe') s.recipe = s.recipe.filter(x => x !== id);
  else if (INNER.includes(key)) s.inner[key] = null;
  else s.slots[key] = null;
}
const accepts = (target, b) => target === 'backbone' ? (b.slot === 'backbone' || INNER.includes(b.slot)) : b.slot === target;

/* ================= 积木 HTML ================= */
function brickHTML(id, cls = '', extra = '') {
  const b = B[id]; const n = cls.includes('mini') ? 3 : 4;

      run() { T.vis.forEach(e => e.classList.add('fade')); T.vis = []; }});
  } else if (S.connector) steps.push({focus:['connector'], warn:true, title:'连接器闲置', text:'有连接器但没有视觉编码器，转接头那一头什么也没接。'});
  if (S.proprio) steps.push({focus:['proprio'], title:'本体感知', text:B[S.proprio].flow,
    run() { T.state = ['θ1-3','θ4-6','夹爪'].map(l => tok(l, 't-state')); settle(T.state, inner(LAY.srcState), inner(LAY.proprio)); }});
  const all = () => [...T.vis, ...T.text, ...T.state];
  if (hasBB) {
    const bb = S.backbone ? B[S.backbone] : null;
    steps.push({focus:['backbone'], title:'进入主干' + (bb ? ' ' + bb.name : ''), text:`${T.vis.length || S.vision ? '视觉 token 和文字 token' : '所有 token'}${S.proprio ? '、状态 token' : ''}拼成一条序列，送进 Transformer 主干。`,
      run() { all().forEach(e => e.style.fontSize = '11px'); arrange(all(), BB_TOK, {gap:4, ch:26}); }});
    INNER.forEach(k => { const v = I[k];
      if (v) steps.push({focus:['chip:' + k], title:SLOT[k].name + ' ' + B[v].name, text:B[v].flow, tip:B[v].metaphor,
        run() { all().forEach(e => { e.classList.remove('pulse'); void e.offsetWidth; e.classList.add('pulse'); });
          if (k === 'ffn' && (v === 'moe' || v === 'dsmoe')) all().forEach((e, i) => setXY(e, e._x, e._y + (i % 2 ? -6 : 6))); }});
      else steps.push({focus:['chip:' + k], warn:true, title:SLOT[k].name + '是空的', text:`Block 里缺${SLOT[k].name}，这一层拼不完整。点「展开 Block」补上。`}); });
    steps.push({focus:['backbone'], title:`重复 ×${bb ? bb.layers : 'N'} 层`, text:'上面这一套（注意力交流 + FFN 加工 + 残差相加）一层层叠起来重复，每层参数不同。最后一个位置的向量汇总了整句话和整张图的信息。',
      run() { arrange(all(), BB_TOK, {gap:4, ch:26}); }});
  } else steps.push({focus:['backbone'], warn:true, title:'主干是空的', text:'没有 Transformer 主干，token 无处可去。拖一个主干型号进来，或展开 Block 自己拼。'});
  if (head) {
    steps.push({focus:['head'], title:'输出头 ' + head.name, text:head.flow,
      run() { const a = all(); const last = a[a.length - 1]; a.forEach(e => { if (e !== last) e.classList.add('fade'); });
        if (last) { last.textContent = 'h'; last.style.background = 'var(--c-backbone)'; arrange([last], inner(LAY.head)); } }});
    const outR = {x:LAY.out.x + 12, y:LAY.out.y + 36, w:LAY.out.w - 24, h:148};
    const actR = {x:LAY.out.x + 12, y:LAY.out.y + 226, w:LAY.out.w - 24, h:90};
    if (!act) steps.push({focus:['out'], title:'输出文字', text:`模型一个词一个词地生成：「${(sc.answer || []).join('')}」。每生成一个词，就把它接回输入再算下一个。`,
      run() { const ws = sc.answer.map(w => tok(w, 't-out fade')); arrange(ws, outR);
        ws.forEach((w, i) => later(() => { w.classList.remove('notr', 'fade'); clack(); }, 250 + i * 380)); }});
    else {
      const id = head.id;
      steps.push({focus:['out'], title:'输出动作', text:id === 'discrete_action' ? '7 个动作 token（每个是 0–255 的区间编号）反离散化成末端位移、旋转和夹爪指令，机械臂动起来。'
          : id === 'fast' ? '生成少量 FAST token，逆 DCT 还原成一整段平滑轨迹，机械臂动起来。'
          : id === 'flow_expert' ? '灰色噪声沿速度场一步步变成橙色动作块：一次输出未来 50 步动作，机械臂按动作块执行。'
          : '灰色噪声经过多步去噪变成动作序列，机械臂按序列执行。',
        run() {
          let ts;
          if (id === 'discrete_action') ts = ['128','64','201','127','127','90','255'].map(x => tok(x, 't-act fade'));
          else if (id === 'fast') ts = ['F12','F307','F5','F88'].map(x => tok(x, 't-act fade'));
          else ts = ['a₁','a₂','a₃','…','a₅₀'].map(x => tok(x, 't-noise fade'));
          arrange(ts, actR, {gap:4});
          ts.forEach((t, i) => later(() => { t.classList.remove('notr', 'fade'); }, 150 + i * 200));
          if (id === 'flow_expert' || id === 'diffusion') later(() => ts.forEach(t => { t.classList.remove('t-noise'); t.classList.add('t-act'); }), 1300);
          later(() => $('#arm').classList.add('moving'), 900);
        }});
    }
    steps.push({focus:[], title:'完成', text:`数据走完一遍：${[S.tokenizer && '分词', S.vision && '看图', S.connector && '对齐', hasBB && '主干推理', act ? '输出动作' : '输出文字'].filter(Boolean).join(' → ')}。按 R 重新运行。`});
  } else steps.push({focus:['head'], warn:true, title:'缺少输出头', text:'主干算完了，但没有输出头把向量变成文字或动作。'});
  return steps;
}
function showFocus(list) {
  $$('.flow-focus').forEach(e => e.classList.remove('flow-focus'));
  list.forEach(f => { let e = null;
    if (f.startsWith('chip:')) e = $(`.chip-slot[data-chip="${f.slice(5)}"]`);
    else if (f.startsWith('src')) e = $('#' + f);
    else if (f === 'out') e = $('.outzone');
    else e = $(`#slots1 .slot[data-drop="${f}"]`);
    if (e) e.classList.add('flow-focus'); });
  $$('.src,.outzone').forEach(e => e.style.boxShadow = e.classList.contains('flow-focus') ? '0 0 0 4px var(--gold),0 0 22px rgba(255,209,102,.8)' : '');
}
function startFlow(auto) {
  stopEvo(); closePop(); if (card) closeCard(); if (blockOpen) closeBlock();
  cancelFlow(); flow = {steps:buildFlow(), i:-1, auto, timers:[], timer:null};
  $('#stage').classList.add('flowing'); nextFlow();
}
function nextFlow() {
  if (!flow) return startFlow(false);
  clearTimeout(flow.timer);
  flow.i++;
  if (flow.i >= flow.steps.length) { cancelFlow(); return; }
  const s = flow.steps[flow.i];
  showFocus(s.focus || []);
  let cap = $('#stage .cap'); if (!cap) { cap = document.createElement('div'); cap.className = 'cap'; $('#stage').appendChild(cap); }
  cap.classList.toggle('warn', !!s.warn);
  cap.innerHTML = `<span class="n">${flow.i + 1}/${flow.steps.length}</span><span class="t">${esc(s.title)}</span><span>${esc(s.text)}</span>`;
  try { s.run && s.run(); } catch (e) { console.error(e); }
  renderHints(); updateRunBtn();
  if (flow.auto && flow.i < flow.steps.length - 1) flow.timer = setTimeout(nextFlow, s.dwell || 2800);
  else if (flow.i === flow.steps.length - 1) { flow.auto = false; updateRunBtn(); }
}
function cancelFlow() {
  if (flow) { clearTimeout(flow.timer); flow.timers.forEach(clearTimeout); }
  flow = null; tokLayer().innerHTML = ''; const c = $('#stage .cap'); c && c.remove();
  showFocus([]); $('#stage').classList.remove('flowing'); const pg = $('#patchGrid'); if (pg) pg.style.opacity = 0;
  $('#arm').classList.remove('moving'); updateRunBtn(); renderHints();
}
function toggleRun() {
  if (evo) stopEvo();
  if (!flow || flow.i >= flow.steps.length - 1) return startFlow(true);
  flow.auto = !flow.auto;
  if (flow.auto) nextFlow(); else { clearTimeout(flow.timer); updateRunBtn(); }
}
function updateRunBtn() { const b = $('#bRun'); const running = flow && flow.auto;
  b.innerHTML = (running ? '暂停' : '运行') + ' <kbd>R</kbd>'; b.classList.toggle('on', !!running); b.classList.toggle('primary', !running); }

/* ================= 预设 & 演化 ================= */
function presetState(p) { const s = emptyState(); Object.assign(s.slots, p.slots); Object.assign(s.inner, p.inner); s.recipe = [...(p.recipe || [])]; return s; }
function loadPreset(id, opts = {highlight:true}) { const p = PRESET[id]; const ns = presetState(p); commit(s => { s.slots = ns.slots; s.inner = ns.inner; s.recipe = ns.recipe; }, opts); }
function diffList(a, b) {
  const nm = id => id ? B[id].name : '（空）'; const out = [];
  KEYS.forEach(k => { if (val(a, k) !== val(b, k)) out.push(`${SLOT[k].name.replace(/（.*）/,'')}：${nm(val(a, k))} → ${nm(val(b, k))}`); });
  return out;
}
function startEvo() {
  if (flow) cancelFlow(); closePop(); if (blockOpen) closeBlock();
  evo = {i:0, timer:null}; loadPreset(CFG.evolution[0]); showEvo([]); $('#bEvo').classList.add('on'); scheduleEvo();
}
function scheduleEvo() { clearTimeout(evo.timer); if (evo.i < CFG.evolution.length - 1) evo.timer = setTimeout(nextEvo, 7000); }
function nextEvo() {
  if (!evo) return;
  if (evo.i >= CFG.evolution.length - 1) { stopEvo(); return; }
  const prev = clone(st); evo.i++;
  loadPreset(CFG.evolution[evo.i]);
  showEvo(diffList(prev, st)); scheduleEvo();
}
function showEvo(chg) {
  const e = $('#evo'); const seq = CFG.evolution;
  const ep = PRESET[seq[evo.i]];
  e.innerHTML = `<div class="route">演化路线 ${seq.map((id, i) => `<b class="${i === evo.i ? 'cur' : i < evo.i ? 'done' : ''}">${esc(PRESET[id].name)}</b>`).join('<span>→</span>')}
    <span style="margin-left:auto">空格 下一步 · Esc 退出</span></div>
    <div class="msg">${esc(ep.evoNote)}</div>${chg.length ? `<div class="chg">这次换了什么：${chg.map(esc).join('；')}</div>` : ''}${evo.i === seq.length - 1 ? '<div class="chg">演化到终点。再按空格退出。</div>' : ''}`;
  e.hidden = false; renderHints();
}
function stopEvo() { if (!evo) return; clearTimeout(evo.timer); evo = null; $('#evo').hidden = true; $('#bEvo').classList.remove('on'); renderHints(); }

/* ================= 缩放 ================= */
function fit() {
  const w = $('#stageWrap'); const W = w.clientWidth, H = w.clientHeight; const pad = 14;
  const s = Math.max(.2, Math.min((W - pad * 2) / 1440, (H - pad * 2) / 660));
  const x = (W - 1440 * s) / 2, y = Math.max(pad, (H - 660 * s) / 2);
  $('#stage').style.transform = `translate(${x}px,${y}px) scale(${s})`;
}

/* ================= 事件 ================= */
function bind() {
  document.addEventListener('pointerdown', e => {
    const br = e.target.closest('.brick'); if (!br || br.classList.contains('ghost') || br.closest('#pop') || br.closest('#cardBg')) return;
    const id = br.dataset.brick;
    let fromKey = null;
    const sk = br.closest('[data-fill]'); const chip = br.closest('[data-chip]');
    if (br.closest('#bbModel')) fromKey = 'backbone';
    else if (chip) fromKey = chip.dataset.chip;
    else if (sk) fromKey = sk.dataset.fill;
    else if (!br.closest('#lib')) return;
    startPointer(e, id, fromKey, br);
  });
  document.addEventListener('click', e => {
    const t = e.target;
    if (t.closest('button')) setTimeout(() => t.closest('button') && t.closest('button').blur(), 0);
    const sw = t.closest('[data-swap]'); if (sw) { openPop(sw.dataset.swap, sw.closest('.slot')); return; }
    const pick = t.closest('[data-pick]'); if (pick && popKey) { const id = pick.dataset.pick, key = popKey;
      commit(s => { if (key === 'recipe' && s.recipe.includes(id)) s.recipe = s.recipe.filter(x => x !== id); else placeInto(s, id, key); }); closePop(); return; }
    const rm = t.closest('[data-rm]'); if (rm) { const k = rm.dataset.rm; commit(s => removeFrom(s, k, val(s, k))); closePop(); return; }
    if (t.closest('#bExpand')) { openBlock(); return; }
    if (t.closest('#bBack')) { closeBlock(); return; }
    if (t.closest('#cardX') || t.id === 'cardBg') { closeCard(); return; }
    const tab = t.closest('[data-tab]'); if (tab) { libTab = tab.dataset.tab; renderLib(); return; }
    if (t.closest('#bSim')) { toggleSim(); return; }
    const sr = t.closest('.sim-row'); if (sr) { stopEvo(); loadPreset(sr.dataset.p); return; }
    if (simOpen && !t.closest('#sim')) toggleSim(false);
    const pb = t.closest('.pbtn'); if (pb) { stopEvo(); loadPreset(pb.dataset.p); return; }
    const emptySock = t.closest('.socket.empty'); if (emptySock) { openPop(emptySock.dataset.fill, emptySock.closest('.slot')); return; }
    if (t.closest('.chip-slot.empty') || t.closest('#bbModel.empty')) { t.closest('#bbModel.empty') ? openPop('backbone', $('#bbSlot')) : openBlock(); return; }
    const rs = t.closest('.socket[data-fill="recipe"]'); if (rs && !t.closest('.brick')) { openPop('recipe', rs.closest('.slot')); return; }
    if (!t.closest('#pop')) closePop();
  });
  $('#bbSlot').addEventListener('dblclick', e => { if (!e.target.closest('.brick')) openBlock(); });
  $('#bRun').onclick = toggleRun;
  $('#bStep').onclick = () => evo ? nextEvo() : nextFlow();
  $('#bEvo').onclick = () => evo ? stopEvo() : startEvo();
  $('#bUndo').onclick = undo;
  $('#bClear').onclick = () => { stopEvo(); commit(s => { const e = emptyState(); s.slots = e.slots; s.inner = e.inner; s.recipe = []; }); };
  $('#bHints').onclick = toggleHints;
  $('#bSound').onclick = () => { soundOn = !soundOn; $('#bSound').classList.toggle('on', soundOn); };
  $('#bFull').onclick = toggleFull;
  document.addEventListener('keydown', e => {
    if (e.target.matches && e.target.matches('input,textarea,select')) return;
    const k = e.key;
    if (k === 'Escape') { if (card) closeCard(); else if (simOpen) toggleSim(false); else if (popKey) closePop(); else if (blockOpen) closeBlock(); else if (evo) stopEvo(); else if (flow) cancelFlow(); return; }
    if (card) { if (k === ' ') e.preventDefault(); return; }
    if ((e.ctrlKey || e.metaKey) && (k === 'z' || k === 'Z')) { e.preventDefault(); undo(); return; }
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (k === ' ') { e.preventDefault(); if (e.repeat) return; evo ? nextEvo() : nextFlow(); }
    else if (k === 'r' || k === 'R') toggleRun();
    else if (/^[0-9]$/.test(k)) { const p = CFG.presets.find(p => p.hotkey === k); if (p) { stopEvo(); closePop(); loadPreset(p.id); } }
    else if (k === 'e' || k === 'E') evo ? stopEvo() : startEvo();
    else if (k === 'b' || k === 'B') blockOpen ? closeBlock() : openBlock();
    else if (k === 'h' || k === 'H') toggleHints();
    else if (k === 's' || k === 'S') toggleSim();
    else if (k === 'f' || k === 'F') toggleFull();
  });
  document.addEventListener('keyup', e => { if (e.key === ' ') e.preventDefault(); });
  new ResizeObserver(fit).observe($('#stageWrap'));
  addEventListener('resize', () => simOpen && recognize());
}
function undo() { if (!hist.length) return; stopEvo(); if (flow) cancelFlow(); const prev = clone(st); st = hist.pop(); render(prev); }
function toggleHints() { hintsOn = !hintsOn; $('#hints').hidden = !hintsOn; $('#bHints').classList.toggle('on', hintsOn); renderHints(); setTimeout(fit, 0); }
function toggleFull() { try { if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {}); else document.exitFullscreen(); } catch (e) {} }

/* ================= 启动 ================= */
function init() {
  $('#presets').insertAdjacentHTML('beforeend', CFG.presets.map(p => `<button class="pbtn" data-p="${p.id}" data-kind="${p.kind}"><span class="k">${p.hotkey}</span>${esc(p.name)}</button>`).join(''));
  buildStage(); bind();
  st = presetState(PRESET.gpt2);
  render(null); fit();
}
init();
</script>
